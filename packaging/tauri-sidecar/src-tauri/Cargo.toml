[package]
name = "xkr-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false
description = "xkr desktop app: wallet, node, miner, p2pool and Hugin relay; runs xkrd (and its Hyperswarm bridge) as a sidecar."

# A workspace of its own. The xkr root Cargo.toml lists its members explicitly and does not
# include this crate; this empty table stops Cargo from treating the root as its workspace, so
# `cargo build --workspace` at the root never builds Tauri, and this crate gets its own target/.
[workspace]

# Exact versions only, like the main workspace.
[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri      = { version = "=2.12.3", features = [] }
serde      = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
tauri-plugin-dialog = "=2.8.4"
tokio      = { version = "=1.54.1", features = ["sync"] }
zeroize    = "=1.8.2"
# the wallet engine, from the main workspace (it syncs from the bundled xkrd)
xkr-wallet    = { path = "../../../crates/xkr-wallet" }
xkr-consensus = { path = "../../../crates/xkr-consensus" }

# SIGINT for a clean xkrd shutdown.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

# Ctrl-C for a clean xkrd shutdown (AttachConsole + GenerateConsoleCtrlEvent).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
